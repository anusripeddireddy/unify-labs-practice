<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 15 Practice Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root">

            <h1>Lab <span>Session</span> <span id="selectedDay">15</span></h1>

console.log('Hello from Day 15!');
document.getElementById('display').innerHTML = 'Code executed successfully!';
</textarea>
                <div id="consoleOutput" class="console-output"></div>

        </div>
    </div>
    
    <script src="script.js"></script>
