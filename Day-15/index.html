<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>THE VIRTUAL CORE</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Boot / Splash Screen -->
  <div id="boot-screen">
    <div class="boot-title">THE VIRTUAL CORE</div>
    <div class="boot-subtitle">Terminal OS Simulation</div>
    <div class="boot-loading">Booting core modules...</div>
  </div>

  <!-- Main Shell -->
  <div id="terminal" class="hidden">
    <div id="terminal-header">
      <div class="terminal-title">THE VIRTUAL CORE</div>
      <div class="terminal-status">
        <span id="session-user">guest</span> @ CORE
        <span id="session-time"></span>
      </div>
    </div>

    <div id="terminal-output" aria-live="polite"></div>

    <div id="terminal-input-wrapper">
      <span id="prompt-label">core&gt;</span>
      <input
        id="terminal-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        autofocus
      />
    </div>
  </div>

  <!-- Minimal help overlay for keyboard hint -->
  <div id="hint-bar">
    Type <span class="hint-cmd">help</span> to see available commands.
  </div>

  <script src="app.js"></script>
</body>
</html>
