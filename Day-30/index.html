<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN - Digital Marketplace</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo"><i class="fas fa-store"></i> TITAN</h1>
            <div class="nav-tabs">
                <a href="#shop" class="nav-tab active" data-tab="shop"><i class="fas fa-shopping-bag"></i> Shop</a>
                <a href="#cart" class="nav-tab" data-tab="cart"><i class="fas fa-shopping-cart"></i> Cart (<span id="cartCount">0</span>)</a>
                <a href="#orders" class="nav-tab" data-tab="orders"><i class="fas fa-box"></i> Orders</a>
            </div>
        </div>
    </nav>

    <!-- SHOP TAB -->
    <section id="shop" class="tab active">
        <div class="container">
            <div class="hero">
                <h1>Discover Amazing Products</h1>
                <p>High-quality items at unbeatable prices</p>
            </div>
            
            <div class="filters">
                <input type="text" id="searchInput" placeholder="🔍 Search products...">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="electronics">Electronics</option>
                    <option value="clothing">Clothing</option>
                    <option value="home">Home & Garden</option>
                    <option value="sports">Sports</option>
                </select>
                <div class="price-range">
                    <input type="range" id="priceSlider" min="0" max="500" value="500">
                    <span id="priceValue">$500</span>
                </div>
            </div>
            
            <div id="productsGrid" class="products-grid"></div>
        </div>
    </section>

    <!-- CART TAB -->
    <section id="cart" class="tab">
        <div class="container">
            <h2>Shopping Cart</h2>
            <div id="cartItems" class="cart-list"></div>
            <div class="cart-total">
                <div>Total: $<span id="cartTotal">0</span></div>
                <button id="checkoutBtn" class="btn-checkout">Proceed to Checkout</button>
            </div>
        </div>
    </section>

    <!-- ORDERS TAB -->
    <section id="orders" class="tab">
        <div class="container">
            <h2>Your Orders</h2>
            <div id="ordersList" class="orders-grid"></div>
        </div>
    </section>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Checkout</h3>
            <form id="checkoutForm">
                <input type="text" id="customerName" placeholder="Full Name" required>
                <input type="email" id="customerEmail" placeholder="Email" required>
                <input type="tel" id="customerPhone" placeholder="Phone">
                <textarea id="shippingAddress" placeholder="Shipping Address" required></textarea>
                <div class="total-preview">Total: $<span id="modalTotal">0</span></div>
                <button type="submit" class="btn-checkout">Place Order</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
