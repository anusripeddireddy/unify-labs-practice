<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Text Formatter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Smart Text Formatter</h1>
        <textarea id="inputText" placeholder="Enter text here..."></textarea>
        <div class="buttons">
            <button onclick="cleanText()">Clean</button>
            <button onclick="formatText()">Format</button>
            <button onclick="generateStats()">Stats</button>
        </div>
        <textarea id="outputText" readonly></textarea>
        <div id="stats"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
